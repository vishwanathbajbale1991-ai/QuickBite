<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite - Food Order</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.login-screen{background:linear-gradient(135deg,#ff5722,#ff9800);height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{background:white;padding:40px;border-radius:20px;text-align:center;width:90%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.login-box h1{color:#ff5722;font-size:32px;margin-bottom:10px}
.login-btn{width:100%;padding:15px;margin:10px 0;border:none;border-radius:12px;font-size:18px;cursor:pointer;font-weight:bold;color:white}
.btn-user{background:#4caf50}.btn-user:hover{background:#45a049}
.btn-admin{background:#2196f3}.btn-admin:hover{background:#1976d2}
.header{background:#ff5722;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.btn{padding:10px 15px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.btn-danger{background:#f44336;color:white}
.btn-admin-header{background:#2196f3;color:white;display:none}
.container{padding:20px}
h2{margin-bottom:20px;color:#333}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:white;border-radius:12px;text-align:center;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);cursor:pointer}
.card:hover{transform:scale(1.03)}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- PAGE 1: LOGIN -->
<div id="loginPage" class="login-screen">
  <div class="login-box">
    <h1>🍔 QuickBite</h1>
    <p style="color:#666;margin-bottom:30px">Panel Select Kara</p>
    <button class="login-btn btn-user" onclick="doLogin('user')">👤 User Panel</button>
    <button class="login-btn btn-admin" onclick="doLogin('admin')">⚙️ Admin Panel</button>
  </div>
</div>

<!-- PAGE 2: APP -->
<div id="appPage" class="hidden">
  <div class="header">
    <h2>Welcome <span id="userName">Guest</span></h2>
    <div>
      <button class="btn btn-admin-header" id="adminBtn">⚙️ Admin</button>
      <button class="btn btn-danger" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="container">
    <h2>Restaurant Select Kara</h2>
    <div class="grid">
      <div class="card"><img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500"><h4>Pizza Hut</h4></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500"><h4>McDonalds</h4></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=500"><h4>Nagpur Misal</h4></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=500"><h4>Burger King</h4></div>
    </div>
  </div>
</div>

<script>
// JEHVHA PAGE LOAD HOIL
window.onload = function(){
  let role = localStorage.getItem('currentUserRole');
  if(role){
    showApp(role);
  } else {
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('appPage').classList.add('hidden');
  }
}

// LOGIN FUNCTION
function doLogin(role){
  localStorage.setItem('currentUser', role === 'admin' ? 'Admin' : 'Guest User');
  localStorage.setItem('currentUserRole', role);
  showApp(role);
}

// APP SHOW KARNARE FUNCTION
function showApp(role){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('userName').innerText = localStorage.getItem('currentUser');
  if(role === 'admin'){ 
    document.getElementById('adminBtn').style.display = 'inline-block'; 
  }
}

// LOGOUT FUNCTION
function doLogout(){
  localStorage.clear();
  location.reload();
}
</script>
</body>
</html>
