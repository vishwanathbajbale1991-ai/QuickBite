<!DOCTYPE html>
<html lang="en">
<head>
  <title>QuickBite Admin Panel</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0; padding:0; box-sizing:border-box}
    body{font-family: 'Segoe UI', Arial; background:#f5f5f5}
   .page{padding:20px; max-width:1000px; margin:0 auto}
   .header{background:#ff5722; color:white; padding:20px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px}
   .card{background:white; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 3px 10px rgba(0,0,0,0.1)}
   .card h3{color:#ff5722; margin-bottom:15px}
    input, select{padding:12px; margin:8px 5px; width:90%; border:2px solid #ddd; border-radius:8px}
   .btn{background:#ff5722; color:white; padding:12px 20px; border:none; border-radius:8px; cursor:pointer; margin:5px; font-weight:600}
   .btn:hover{background:#e64a19}
   .btn-danger{background:#f44336}
   .btn-success{background:#4caf50}
   .order-item{background:#f1f1f1; padding:15px; border-radius:8px; margin:10px 0}
    table{width:100%; border-collapse:collapse}
    th, td{padding:12px; border-bottom:1px solid #ddd; text-align:left}
  </style>
</head>
<body>

<div class="page">
  <div class="header">
    <h2>🍔 QuickBite Admin Panel</h2>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
  </div>

  <!-- 1. ADD FOOD SECTION -->
  <div class="card">
    <h3>➕ Add New Food Item</h3>
    <select id="resSelect">
      <option value="1">Pizza Hut</option>
      <option value="2">McDonalds</option>
      <option value="3">Nagpur Misal</option>
      <option value="4">Burger King</option>
    </select><br>
    <input type="text" id="foodName" placeholder="Food Name - ex: Paneer Pizza"><br>
    <input type="number" id="foodPrice" placeholder="Price - ex: 250"><br>
    <input type="text" id="foodImg" placeholder="Image URL"><br>
    <button class="btn btn-success" onclick="addFood()">Add Food</button>
  </div>

  <!-- 2. SEE ORDERS SECTION -->
  <div class="card">
    <h3>📦 Recent Orders</h3>
    <div id="ordersList">
      <p>No orders yet</p>
    </div>
  </div>

  <!-- 3. MANAGE MENU SECTION -->
  <div class="card">
    <h3>📋 Current Menu</h3>
    <div id="menuList"></div>
  </div>

</div>

<script>
// Login check - Admin nasel tar login page var pathav
if(localStorage.getItem('currentUserRole')!== 'admin'){
  alert("Fakt Admin la access aahe");
  window.location.href = "index.html";
}

let menuData = JSON.parse(localStorage.getItem('menuData')) || {
 1: [ // Pizza Hut
    {id:11, name:"Margherita Pizza", price:250, img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400"},
    {id:12, name:"Pepperoni Pizza", price:300, img:"https://images.unsplash.com/photo-1628840042765-3564f2e708d3?w=400"},
    {id:13, name:"Cheese Burst Pizza", price:350, img:"https://images.unsplash.com/photo-1595854341625-f33ee3dbf786?w=400"},
    {id:14, name:"Veggie Delight Pizza", price:280, img:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"}
  ],
 2: [ // McDonalds
    {id:21, name:"Big Mac", price:180, img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"},
    {id:22, name:"French Fries", price:80, img:"https://images.unsplash.com/photo-1585109649139-366004e1f9d2?w=400"},
    {id:23, name:"Chicken Burger", price:150, img:"https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=400"},
    {id:24, name:"Coke", price:50, img:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=400"}
  ],
 3: [ // Nagpur Special
    {id:31, name:"Misal Pav", price:100, img:"https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400"},
    {id:32, name:"Vada Pav", price:40, img:"https://images.unsplash.com/photo-1626132647523-66f4f9ad3066?w=400"},
    {id:33, name:"Pav Bhaji", price:120, img:"https://images.unsplash.com/photo-1631515242808-497c3f9e4d0b?w=400"},
    {id:34, name:"Thali", price:200, img:"https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=400"}
  ],
 4: [ // Burger King
    {id:41, name:"Whopper", price:190, img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"},
    {id:42, name:"Chicken Whopper", price:210, img:"https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=400"},
    {id:43, name:"Cheese Burger", price:130, img:"https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400"},
    {id:44, name:"Onion Rings", price:90, img:"https://images.unsplash.com/photo-1633321702518-7feccafb94f1?w=400"}
  ]
};

let orders = JSON.parse(localStorage.getItem('orders')) || [];

function addFood(){
  let resId = document.getElementById('resSelect').value;
  let name = document.getElementById('foodName').value;
  let price = document.getElementById('foodPrice').value;
  let img = document.getElementById('foodImg').value;

  if(!name ||!price){ alert("Name and Price required"); return; }

  let newId = Date.now();
  allMenu[resId].push({id:newId, name:name, price:parseInt(price), img:img});
  localStorage.setItem('menuData', JSON.stringify(allMenu));

  alert(name + " added successfully!");
  document.getElementById('foodName').value = "";
  document.getElementById('foodPrice').value = "";
  loadMenu();
}

function loadMenu(){
  let html = "";
  for(let res in allMenu){
    html += `<h4>Restaurant ${res}</h4><table><tr><th>Name</th><th>Price</th></tr>`;
    allMenu[res].forEach(item=>{
      html += `<tr><td>${item.name}</td><td>₹${item.price}</td></tr>`;
    });
    html += `</table><br>`;
  }
  document.getElementById('menuList').innerHTML = html;
}

function loadOrders(){
  if(orders.length == 0){
    document.getElementById('ordersList').innerHTML = "<p>No orders yet</p>";
    return;
  }
  let html = "";
  orders.forEach(o=>{
    html += `<div class="order-item">
      <b>Customer:</b> ${o.user} <br>
      <b>Total:</b> ₹${o.total} <br>
      <b>Status:</b> ${o.status}
    </div>`;
  });
  document.getElementById('ordersList').innerHTML = html;
}

function logout(){
  localStorage.removeItem('currentUserRole');
  window.location.href = "index.html";
}

// Page load zalyavar
loadMenu();
loadOrders();
</script>
</body>
  </html>
