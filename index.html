<!DOCTYPE html>
<html lang="en">
<head>
  <title>QuickBite Food Ordering System</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0; padding:0; box-sizing:border-box}
    body{font-family: 'Segoe UI', Arial; background:#f5f5f5}
   .page{padding:20px; max-width:1200px; margin:0 auto}
    #loginPage{text-align:center; background:white; padding:40px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1); max-width:400px; margin:50px auto}
    #loginPage h2{color:#ff5722; margin-bottom:10px}
    input, select{padding:12px; margin:10px; width:85%; border:2px solid #ddd; border-radius:8px; font-size:15px}
   .btn{background:#ff5722; color:white; padding:14px; border:none; border-radius:8px; cursor:pointer; font-size:16px; margin:8px; width:85%; font-weight:600}
   .btn:hover{background:#e64a19}
   .link-btn{background:none; color:#2196f3; border:none; text-decoration:underline; cursor:pointer}
  </style>
</head>
<body>

  <div id="loginPage" class="page">
    <h2>🍔 QuickBite Login</h2>
    <select id="role">
      <option value="user">User Login</option>
      <option value="admin">Admin Login</option>
    </select><br>
    <input type="text" id="name" placeholder="Enter Name" style="display:none"><br>
    <input type="email" id="email" placeholder="Enter Email"><br>
    <input type="password" id="password" placeholder="Enter Password"><br><br>
    <button class="btn" id="mainBtn" onclick="handleAuth()">Login</button><br>
    <button class="link-btn" id="toggleBtn" onclick="toggleForm()">Don't have account? Sign Up</button><br><br>
    <button class="btn" style="background:#f44336" onclick="resetData()">Reset All Data</button>
    <p style="font-size:12px; color:gray">Reset dabavla ki sagle user delete hotil</p>
  </div>

<script>
let isLogin = true;

const ADMIN_EMAIL = "admin@quickbite.com";
const ADMIN_PASS = "admin123";

function toggleForm(){
  isLogin =!isLogin;
  if(isLogin){
    document.getElementById('name').style.display = 'none';
    document.getElementById('mainBtn').innerText = 'Login';
    document.getElementById('toggleBtn').innerText = "Don't have account? Sign Up";
  } else {
    document.getElementById('name').style.display = 'inline-block';
    document.getElementById('mainBtn').innerText = 'Sign Up';
    document.getElementById('toggleBtn').innerText = "Already have account? Login";
  }
}

function resetData(){
  if(confirm("Nakki sagle user delete karayche ka?")){
    localStorage.clear();
    alert("Sagle data delete zale. Ata navin SignUp karu shakto");
  }
}

function handleAuth(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  let role = document.getElementById('role').value;

  if(!isLogin){ // SIGNUP
    let name = document.getElementById('name').value;
    if(!name ||!email ||!pass){ alert("All fields required"); return; }
    if(localStorage.getItem(email)){ alert("User already exists. Login kar kinva navin email vapar"); return; }
    localStorage.setItem(email, JSON.stringify({name:name, pass:pass}));
    alert("Sign Up Success! Ata Login kara");
    toggleForm();
  } else { // LOGIN
    if(role == "admin" && email == ADMIN_EMAIL && pass == ADMIN_PASS){
      alert("Welcome Admin!");
      localStorage.setItem('currentUser', 'Admin');
      localStorage.setItem('currentUserRole', 'admin');
      window.location.href = "admin.html"; // Admin la ithe pathavla
    } else {
      let user = JSON.parse(localStorage.getItem(email));
      if(user && user.pass == pass){
        alert("Welcome " + user.name);
        localStorage.setItem('currentUser', user.name);
        localStorage.setItem('currentUserRole', 'user');
        window.location.href = "menu.html"; // User la ithe pathavla
      } else {
        alert("Invalid Email or Password!");
      }
    }
  }
}
</script>
</body>
</html>    <button class="btn" style="background:#f44336" onclick="resetData()">Reset All Data</button>
    <p style="font-size:12px; color:gray">Reset dabavla ki sagle user delete hotil</p>
  </div>

  <div id="menuPage" class="page" style="display:none">
    <div class="header">
      <h2 id="welcomeText">Welcome</h2>
      <button class="btn" style="width:auto; background:#f44336" onclick="logout()">Logout</button>
    </div>
    <div style="text-align:center">
      <button class="btn" style="width:auto" onclick="showMenu(1)">🍕 Pizza Hut</button>
      <button class="btn" style="width:auto" onclick="showMenu(2)">🍟 McDonalds</button>
    </div>
    <h2 id="resName">Menu</h2>
    <div id="menu"></div>
  </div>

<script>
let isLogin = true;
let loggedInUser = "";

const allMenuData = {
 1: [{id:11, name:"Margherita Pizza", price:250, img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400"},{id:12, name:"Pepperoni Pizza", price:300, img:"https://images.unsplash.com/photo-1628840042765-356cda07504e?w=400"}],
 2: [{id:21, name:"Big Mac", price:180, img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"},{id:22, name:"French Fries", price:80, img:"https://images.unsplash.com/photo-1585109649139-366004e1f9d2?w=400"}]
};
const resNames = {1:"Pizza Hut", 2:"McDonalds"};
const ADMIN_EMAIL = "admin@quickbite.com";
const ADMIN_PASS = "admin123";

function toggleForm(){
  isLogin =!isLogin;
  if(isLogin){
    document.getElementById('name').style.display = 'none';
    document.getElementById('mainBtn').innerText = 'Login';
    document.getElementById('toggleBtn').innerText = "Don't have account? Sign Up";
  } else {
    document.getElementById('name').style.display = 'inline-block';
    document.getElementById('mainBtn').innerText = 'Sign Up';
    document.getElementById('toggleBtn').innerText = "Already have account? Login";
  }
}

function resetData(){
  if(confirm("Nakki sagle user delete karayche ka?")){
    localStorage.clear();
    alert("Sagle data delete zale. Ata navin SignUp karu shakto");
  }
}

function handleAuth(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  let role = document.getElementById('role').value;

  if(!isLogin){ // SIGNUP
    let name = document.getElementById('name').value;
    if(!name ||!email ||!pass){ alert("All fields required"); return; }
    if(localStorage.getItem(email)){ alert("User already exists. Login kar kinva navin email vapar"); return; }
    localStorage.setItem(email, JSON.stringify({name:name, pass:pass}));
    alert("Sign Up Success! Ata Login kara");
    toggleForm();
  } else { // LOGIN
    if(role == "admin" && email == ADMIN_EMAIL && pass == ADMIN_PASS){
      alert("Welcome Admin!");
      loggedInUser = "Admin";
      showMenuPage();
    } else {
      let user = JSON.parse(localStorage.getItem(email));
      if(user && user.pass == pass){
        alert("Welcome " + user.name);
        loggedInUser = user.name;
        showMenuPage();
      } else {
        alert("Invalid Email or Password!");
      }
    }
  }
}

function showMenuPage(){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('menuPage').style.display = 'block';
  document.getElementById('welcomeText').innerText = "Welcome " + loggedInUser;
  showMenu(1);
}

function showMenu(resId){
  document.getElementById('resName').innerText = resNames[resId];
  let menuDiv = document.getElementById('menu');
  menuDiv.innerHTML = "";
  allMenuData[resId].forEach(item=>{
    menuDiv.innerHTML += `<div class="card">
      <img src="${item.img}" class="food-img">
      <h3>${item.name}</h3>
      <p class="price">₹${item.price}</p>
    </div>`;
  });
}

function logout(){
  document.getElementById('menuPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'block';
}
</script>
</body>
</html>
