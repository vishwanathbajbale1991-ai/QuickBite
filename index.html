<!DOCTYPE html>
<html>
<head>
<title>QuickBite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.login{background:linear-gradient(135deg,#ff5722,#ff9800);height:100vh;display:flex;justify-content:center;align-items:center}
.box{background:white;padding:40px;border-radius:20px;text-align:center;width:90%;max-width:400px}
.btn{width:100%;padding:15px;margin:10px 0;border:none;border-radius:12px;font-size:18px;cursor:pointer;font-weight:bold;color:white}
.btn-user{background:#4caf50} .btn-admin{background:#2196f3} .btn-danger{background:#f44336}
.header{background:#ff5722;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px}
.card{background:white;border-radius:10px;text-align:center;padding:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login" class="login">
  <div class="box">
    <h1>🍔 QuickBite</h1>
    <p style="margin:10px 0 20px">Select Panel</p>
    <button class="btn btn-user" onclick="login('user')">👤 User Panel</button>
    <button class="btn btn-admin" onclick="login('admin')">⚙️ Admin Panel</button>
  </div>
</div>

<!-- APP PAGE -->
<div id="app" class="hidden">
  <div class="header">
    <h3>Welcome <span id="name">Guest</span></h3>
    <div>
      <button class="btn btn-admin" id="adminBtn" style="display:none">⚙️ Admin</button>
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </div>
  <h3 style="padding:15px">Select Restaurant</h3>
  <div class="grid">
    <div class="card"><img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"><h4>Pizza Hut</h4></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"><h4>McDonalds</h4></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400"><h4>Nagpur Misal</h4></div>
    <div class="card"><img src="https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=400"><h4>Burger King</h4></div>
  </div>
</div>

<script>
window.onload=function(){
  if(localStorage.getItem('role')){ showApp(localStorage.getItem('role')); } 
  else{ document.getElementById('login').style.display='flex'; }
}
function login(r){
  localStorage.setItem('role',r); 
  localStorage.setItem('name',r=='admin'?'Admin':'Guest');
  showApp(r);
}
function showApp(r){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('name').innerText=localStorage.getItem('name');
  if(r=='admin'){ document.getElementById('adminBtn').style.display='inline-block'; }
}
function logout(){ localStorage.clear(); location.reload(); }
</script>
</body>
</html>
