<!DOCTYPE html>
<html>
<head>
<title>QuickBite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:Arial}
.login-screen{background:linear-gradient(135deg,#ff5722,#ff9800); height:100vh; display:flex; justify-content:center; align-items:center}
.box{background:white; padding:40px; border-radius:20px; text-align:center}
.btn{padding:15px 30px; margin:10px; border:none; border-radius:12px; font-size:18px; cursor:pointer; width:220px; color:white; font-weight:bold}
.btn-user{background:#4caf50} .btn-admin{background:#2196f3} .btn-danger{background:#f44336}
.header{background:#ff5722; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:15px; padding:15px}
.card{background:white; border-radius:10px; text-align:center; padding:10px; cursor:pointer}
.card img{width:100%; height:120px; object-fit:cover; border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>

<!-- PAGE 1: LOGIN -->
<div id="loginPage" class="login-screen">
  <div class="box">
    <h1>🍔 QuickBite</h1>
    <p>Select Panel</p>
    <button class="btn btn-user" onclick="doLogin('user')">👤 User Panel</button><br>
    <button class="btn btn-admin" onclick="doLogin('admin')">⚙️ Admin Panel</button>
  </div>
</div>

<!-- PAGE 2: APP -->
<div id="appPage" class="hidden">
  <div class="header">
    <h3>Welcome <span id="userName">Guest</span></h3>
    <div>
      <button class="btn btn-admin" id="adminBtn" style="display:none" onclick="alert('Admin Panel Yethe')">⚙️ Admin</button>
      <button class="btn btn-danger" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <h3 style="padding:15px">Select Restaurant</h3>
  <div class="grid">
    <div class="card" onclick="alert('Menu Open')"><img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"><h4>Pizza Hut</h4></div>
    <div class="card" onclick="alert('Menu Open')"><img src="https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400"><h4>Nagpur Misal</h4></div>
  </div>
</div>

<script>
window.onload = function(){
  let role = localStorage.getItem('currentUserRole');
  if(role){ showApp(role); }
  else{ document.getElementById('loginPage').style.display = 'flex'; }
}

function doLogin(role){
  localStorage.setItem('currentUser', role === 'admin' ? 'Admin' : 'Guest');
  localStorage.setItem('currentUserRole', role);
  showApp(role);
}

function showApp(role){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'block';
  document.getElementById('userName').innerText = localStorage.getItem('currentUser');
  if(role === 'admin'){ document.getElementById('adminBtn').style.display = 'inline-block'; }
}

function doLogout(){
  localStorage.clear();
  location.reload();
}
</script>
</body>
</html>
