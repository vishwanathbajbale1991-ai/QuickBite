<!DOCTYPE html>
<html lang="en">
<head>
  <title>QuickBite Food Ordering System</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0; padding:0; box-sizing:border-box}
    body{font-family: 'Segoe UI', Arial; background:#f5f5f5; color:#333}
  .page{padding:20px; max-width:1200px; margin:0 auto; min-height:100vh}
    #loginPage{text-align:center; margin-top:50px; background:white; padding:40px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1); max-width:400px; margin:50px auto}
    #loginPage h2{color:#ff5722; margin-bottom:20px}
    input, select{padding:12px; margin:10px; width:85%; max-width:320px; border:2px solid #ddd; border-radius:8px; font-size:15px}
    input:focus{border-color:#ff5722; outline:none}
  .btn{background:#ff5722; color:white; padding:14px 25px; border:none; border-radius:8px; cursor:pointer; font-size:16px; margin:8px; width:85%; max-width:320px; font-weight:600; transition:0.3s}
  .btn:hover{background:#e64a19; transform:translateY(-2px)}
  .btn-secondary{background:#2196f3}
  .btn-success{background:#4caf50}
  .btn-danger{background:#f44336}
  .link-btn{background:none; color:#2196f3; border:none; text-decoration:underline; cursor:pointer}
  .header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; background:white; padding:15px; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.05)}
  .nav-buttons{display:flex; gap:10px}
  .cart-btn{position:relative}
  .cart-count{background:red; color:white; border-radius:50%; padding:2px 7px; font-size:12px; position:absolute; top:-5px; right:-5px}
    #menu{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:20px; margin-top:20px}
  .card{background:white; padding:15px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); text-align:center; transition:0.3s}
  .card:hover{transform:translateY(-5px); box-shadow:0 8px 20px rgba(0,0,0,0.15)}
   
   /* IMAGE STYLE CHANGED */
  .food-img{width:100%; height:180px; border-radius:10px; object-fit:cover; margin-bottom:10px}
   
  .card h3{margin:10px 0}
  .price{color:#ff5722; font-weight:bold; font-size:18px}
  .cart-item{display:flex; justify-content:space-between; background:white; padding:12px; margin:8px 0; border-radius:8px}
  .remove-btn{background:#f44336; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer}
  .search-box{width:90%; max-width:400px; padding:12px; margin:15px auto; display:block; border-radius:8px; border:2px solid #ddd}
  .footer{text-align:center; padding:20px; margin-top:30px; color:#777}
    @media (max-width: 768px){
    .header{flex-direction:column}
      #menu{grid-template-columns:1fr}
    .btn{width:95%}
    }
  </style>
</head>
<body>

  <div id="loginPage" class="page">
    <h2>🍔 QuickBite Login</h2>
    <p>Online Food Ordering System</p>
    <select id="role">
      <option value="user">User Login</option>
      <option value="admin">Admin Login</option>
    </select><br>
    <input type="email" id="email" placeholder="Enter Email"><br>
    <input type="password" id="password" placeholder="Enter Password"><br><br>
    <button class="btn" onclick="login()">Login</button><br>
    <button class="link-btn" onclick="signup()">Don't have account? Sign Up</button>
    <div class="footer"><p>© 2026 QuickBite Project</p></div>
  </div>

  <div id="menuPage" class="page" style="display:none">
    <div class="header">
      <h2 id="welcomeText">Welcome</h2>
      <div class="nav-buttons">
        <button class="btn btn-success cart-btn" onclick="showCart()">🛒 Cart <span id="cartCount" class="cart-count">0</span></button>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search food..." onkeyup="searchFood()">

    <div id="restaurantButtons" style="text-align:center">
      <button class="btn btn-secondary" onclick="showMenu(1)">🍕 Pizza Hut</button>
      <button class="btn btn-secondary" onclick="showMenu(2)">🍟 McDonalds</button>
      <button class="btn btn-secondary" onclick="showMenu(3)">🌶️ Nagpur Misal</button>
      <button class="btn btn-secondary" onclick="showMenu(4)">🍔 Burger King</button>
    </div>

    <h2 id="resName">Menu</h2>
    <div id="menu"></div>

    <div id="cartPage" style="display:none">
      <h2>🛒 Your Cart</h2>
      <div id="cartItems"></div>
      <h3 id="totalPrice">Total: ₹0</h3>
      <button class="btn btn-success" onclick="placeOrder()">Place Order</button>
      <button class="btn" onclick="backToMenu()">Back to Menu</button>
    </div>

    <div class="footer"><p>QuickBite - Fast Food Delivery</p></div>
  </div>

<script>
let users = [
  {email:"admin@gmail.com", password:"admin123", role:"admin"},
  {email:"test@gmail.com", password:"test123", role:"user"}
];
let loggedInUser = "";
let userRole = "user";
let cart = [];
let currentResId = 1;

// REAL IMAGE LINKS ADD KELE
const allMenuData = {
  1: [
    {id:11, name:"Margherita Pizza", price:250, img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400"},
    {id:12, name:"Pepperoni Pizza", price:300, img:"https://images.unsplash.com/photo-1628840042765-356cda07504e?w=400"},
    {id:13, name:"Veg Pizza", price:280, img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ca4b?w=400"},
    {id:14, name:"Cheese Pizza", price:320, img:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"},
    {id:15, name:"Garlic Bread", price:120, img:"https://images.unsplash.com/photo-1619531031198-3a6c27e9c4d3?w=400"},
    {id:16, name:"Cold Coffee", price:90, img:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=400"}
  ],
  2: [
    {id:21, name:"Big Mac", price:180, img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"},
    {id:22, name:"McChicken", price:150, img:"https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=400"},
    {id:23, name:"French Fries", price:80, img:"https://images.unsplash.com/photo-1585109649139-366004e1f9d2?w=400"},
    {id:24, name:"McFlurry", price:120, img:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400"},
    {id:25, name:"Coke", price:50, img:"https://images.unsplash.com/photo-1554866585-cd94860890b7?w=400"},
    {id:26, name:"Happy Meal", price:200, img:"https://images.unsplash.com/photo-1550547660-d9450f859349?w=400"}
  ],
  3: [
    {id:31, name:"Misal Pav", price:100, img:"https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=400"},
    {id:32, name:"Veg Thali", price:180, img:"https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400"},
    {id:33, name:"Paneer Thali", price:220, img:"https://images.unsplash.com/photo-1631511401850-914f365d6dcd?w=400"},
    {id:34, name:"Butter Milk", price:40, img:"https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?w=400"},
    {id:35, name:"Samosa", price:30, img:"https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400"},
    {id:36, name:"Jalebi", price:60, img:"https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=400"}
  ],
 4: [
    {id:41, name:"Whopper", price:190, img:"https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=400"},
    {id:42, name:"Chicken Burger", price:160, img:"https://images.unsplash.com/photo-1610448724142-4bba5f98e07b?w=400"},
    {id:43, name:"Onion Rings", price:90, img:"https://images.unsplash.com/photo-1633321702518-7feccafb94d5?w=400"},
    {id:44, name:"Ice Cream", price:70, img:"https://images.unsplash.com/photo-1505394033641-40c6ad1178d7?w=400"},
    {id:45, name:"Pepsi", price:50, img:"https://images.unsplash.com/photo-1553456558-aff632853360?w=400"},
    {id:46, name:"Veg Burger", price:130, img:"https://images.unsplash.com/photo-1528605248644-14dd04022da1?w=400"}
  ]
};

const resNames = {1:"Pizza Hut", 2:"McDonalds", 3:"Nagpur Misal", 4:"Burger King"};

function signup(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  if(email == "" || pass == ""){ alert("Please enter Email and Password"); return; }
  const existing = users.find(u => u.email == email);
  if(existing){ alert("User already exists"); return; }
  users.push({email: email, password: pass, role:"user"});
  alert("Account created successfully for: " + email);
  document.getElementById('email').value = "";
  document.getElementById('password').value = "";
}

function login(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  userRole = document.getElementById('role').value;
  const user = users.find(u => u.email == email && u.password == pass && u.role == userRole);
  if(user){
    loggedInUser = email;
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('menuPage').style.display = 'block';
    document.getElementById('welcomeText').innerText = userRole.toUpperCase() + " Welcome: " + email;
    showMenu(1);
  } else { alert("Invalid Email or Password!"); }
}

function logout(){
  loggedInUser = "";
  cart = [];
  document.getElementById('menuPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('cartCount').innerText = 0;
}

function searchFood(){
  const query = document.getElementById('searchBox').value.toLowerCase();
  const menuData = allMenuData[currentResId].filter(item => item.name.toLowerCase().includes(query));
  const menuDiv = document.getElementById('menu');
  menuDiv.innerHTML = '';
  if(menuData.length == 0){
    menuDiv.innerHTML = "<p style='text-align:center; color:gray'>No food found</p>";
    return;
  }
  menuData.forEach(item=>{
    // IMAGE TAG HERE
    menuDiv.innerHTML += `<div class="card"><img class="food-img" src="${item.img}"><h3>${item.name}</h3><p class="price">₹${item.price}</p><button class="btn" onclick='addToCart(${item.id})'>Add to Cart</button></div>`;
  })
}

function showMenu(resId){
  document.getElementById('cartPage').style.display = 'none';
  document.getElementById('restaurantButtons').style.display = 'block';
  document.getElementById('menu').style.display = 'grid';
  currentResId = resId;
  document.getElementById('resName').innerText = resNames[resId] + " Menu";
  searchFood();
}

function addToCart(itemId){
  const item = allMenuData[currentResId].find(i => i.id == itemId);
  cart.push(item);
  document.getElementById('cartCount').innerText = cart.length;
  alert(item.name + " added to cart!");
}

function showCart(){
  document.getElementById('restaurantButtons').style.display = 'none';
  document.getElementById('menu').style.display = 'none';
  document.getElementById('resName').style.display = 'none';
  document.getElementById('cartPage').style.display = 'block';
  const cartDiv = document.getElementById('cartItems');
  cartDiv.innerHTML = '';
  let total = 0;
  if(cart.length == 0){ cartDiv.innerHTML = "<p>Your cart is empty</p>"; }
  else {
    cart.forEach((item, index)=>{
      total += item.price;
      cartDiv.innerHTML += `<div class="cart-item"><img src="${item.img}" style="width:50px;height:50px;border-radius:5px;object-fit:cover"><span>${item.name}</span><span>₹${item.price} <button class="remove-btn" onclick="removeItem(${index})">X</button></span></div>`;
    })
  }
  document.getElementById('totalPrice').innerText = "Total: ₹" + total;
}

function removeItem(index){
  cart.splice(index, 1);
  document.getElementById('cartCount').innerText = cart.length;
  showCart();
}

function backToMenu(){
  document.getElementById('cartPage').style.display = 'none';
  document.getElementById('restaurantButtons').style.display = 'block';
  document.getElementById('menu').style.display = 'grid';
  document.getElementById('resName').style.display = 'block';
  showMenu(currentResId);
}

function placeOrder(){
  if(cart.length == 0){ alert("Your cart is empty"); return; }
  alert("Order Placed Successfully! Total: ₹" + cart.reduce((a,b)=>a+b.price,0));
  cart = [];
  document.getElementById('cartCount').innerText = 0;
  backToMenu();
}
</script>
</body>
</html>
